server {
    listen 80;
    listen [::]:80;
    server_name altalabatalaminah.com www.altalabatalaminah.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://altalabatalaminah.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.altalabatalaminah.com;

    ssl_certificate /etc/nginx/certs/live/altalabatalaminah.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/altalabatalaminah.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://altalabatalaminah.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name altalabatalaminah.com;

    ssl_certificate /etc/nginx/certs/live/altalabatalaminah.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/altalabatalaminah.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/altalabatalaminah.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}
